<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mở Quà May Mắn - HomesCoffee</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#07090e] bg-[radial-gradient(ellipse_80%_80%_at_50%_-20%,rgba(120,119,198,0.15),rgba(255,255,255,0))] min-h-screen flex items-center justify-center p-4 text-slate-100" x-data="giftApp()">

    <!-- Card chính phong cách Dark Luxury -->
    <div class="bg-slate-900/90 w-full max-w-sm rounded-[2.55rem] shadow-[0_0_60px_rgba(0,0,0,0.8)] p-6 sm:p-8 text-center space-y-6 relative overflow-hidden border border-amber-500/30 backdrop-blur-xl">
        
        <!-- Hiệu ứng ánh sáng nền nhẹ phía sau logo -->
        <div class="absolute -top-24 left-1/2 -translate-x-1/2 w-48 h-48 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Header Logo (Bỏ khung, phóng to trực tiếp) -->
        <div class="space-y-2 relative z-10 pt-2">
            <div class="w-75 mx-auto flex items-center justify-center">
                <img src="https://homestechjsc.vn/wp-content/uploads/2026/09/LOGOCAFFE.png" alt="Logo HomesCoffee" class="w-full h-auto object-contain drop-shadow-[0_4px_12px_rgba(255,255,255,0.25)] brightness-125">
            </div>
            <div class="space-y-0.5">
                <p class="text-[11px] text-amber-400/80 font-medium tracking-wide uppercase">Chương trình tri ân khách hàng</p>
            </div>
        </div>
        <!-- Divider sang trọng -->
        <div class="w-16 h-[1px] bg-gradient-to-r from-transparent via-amber-500/50 to-transparent mx-auto"></div>

        <!-- Trạng thái: Lỗi / Không có quyền truy cập -->
        <template x-if="isInvalidLink">
            <div class="space-y-4 py-4 relative z-10">
                <div class="w-16 h-16 bg-rose-500/10 text-rose-400 border border-rose-500/20 rounded-2xl flex items-center justify-center mx-auto text-2xl shadow-inner">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </div>
                <h2 class="font-black text-base text-white">Liên kết không hợp lệ!</h2>
                <p class="text-xs text-slate-400 px-2 leading-relaxed" x-text="errorMessage"></p>
            </div>
        </template>

        <!-- Trạng thái 1: Chưa mở quà (Hợp lệ) -->
        <!-- TRẠNG THÁI 1: CHƯA MỞ QUÀ -->

<template x-if="!isInvalidLink && !hasOpened">
    <div class="relative z-10 w-full max-w-sm mx-auto px-3 py-2"
         x-data="{ isOpening: false }">

    <style>
        /* ================================
           PREMIUM 3D GIFT
        ================================= */

        .gift-scene {
    height: 155px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    perspective: 900px;
}

        .gift-glow {
            position: absolute;
            width: 105px;
            height: 105px;
            border-radius: 999px;
            background: rgba(6, 182, 212, .18);
            filter: blur(28px);
            animation: giftPulse 2.8s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes giftPulse {
            0%, 100% {
                transform: scale(.88);
                opacity: .55;
            }
            50% {
                transform: scale(1.12);
                opacity: .9;
            }
        }

        @keyframes giftRotate {
            0% {
                transform: rotateX(-10deg) rotateY(0deg);
            }
            100% {
                transform: rotateX(-10deg) rotateY(360deg);
            }
        }

        .gift-cube {
            width: 82px;
            height: 82px;
            position: relative;
            transform-style: preserve-3d;
            animation: giftRotate 14s linear infinite;
            transition:
                transform .6s cubic-bezier(.22,1,.36,1),
                opacity .55s ease,
                filter .55s ease;
            z-index: 5;
        }

        .gift-face {
            position: absolute;
            width: 82px;
            height: 82px;
            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    145deg,
                    #080d17 0%,
                    #111827 55%,
                    #172033 100%
                );

            border: 1px solid rgba(34,211,238,.65);

            box-shadow:
                inset 0 0 18px rgba(6,182,212,.12),
                0 0 10px rgba(6,182,212,.08);

            backface-visibility: hidden;
        }

        .gift-front  {
            transform: rotateY(0deg) translateZ(41px);
        }

        .gift-right  {
            transform: rotateY(90deg) translateZ(41px);
        }

        .gift-back   {
            transform: rotateY(180deg) translateZ(41px);
        }

        .gift-left   {
            transform: rotateY(-90deg) translateZ(41px);
        }

        .gift-top {
            transform: rotateX(90deg) translateZ(41px);
            background: linear-gradient(135deg,#155e75,#0e7490);
        }

        .gift-bottom {
            transform: rotateX(-90deg) translateZ(41px);
            background: #075985;
        }

        /* Dải ruy-băng */
        .gift-ribbon-v {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 15px;
            transform: translateX(-50%);
            background:
                linear-gradient(
                    90deg,
                    rgba(6,182,212,.25),
                    rgba(45,212,191,.75),
                    rgba(6,182,212,.25)
                );
        }

        .gift-ribbon-h {
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 15px;
            transform: translateY(-50%);
            background:
                linear-gradient(
                    180deg,
                    rgba(6,182,212,.22),
                    rgba(45,212,191,.72),
                    rgba(6,182,212,.22)
                );
        }

        /* Nút nơ */
        .gift-bow {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%) translateZ(42px);
            z-index: 20;
            color: #67e8f9;
            font-size: 21px;
            filter:
                drop-shadow(0 0 6px rgba(34,211,238,.9))
                drop-shadow(0 0 15px rgba(6,182,212,.45));
        }

        /* Hiệu ứng mở */
        .gift-opening {
            transform:
                scale(1.55)
                rotateX(35deg)
                rotateY(720deg) !important;

            opacity: 0;
            filter:
                brightness(2.8)
                drop-shadow(0 0 25px rgba(34,211,238,1));
        }

        /* Icon mặt bên */
        .gift-side-icon {
            font-size: 18px;
            color: #22d3ee;
            opacity: .75;
            filter: drop-shadow(0 0 6px rgba(34,211,238,.6));
        }

        /* Card nội dung */
        .gift-content {
            margin-top: -1px;
            text-align: center;
        }

        .gift-title {
            font-size: 16px;
            line-height: 1.2;
            font-weight: 900;
            letter-spacing: .03em;
            color: #fff;
        }

        .gift-subtitle {
            margin: 6px auto 0;
            max-width: 310px;
            font-size: 11px;
            line-height: 1.55;
            color: #94a3b8;
        }

        /* Nút */
        .gift-button {
            margin-top: 13px;
            width: 100%;
            min-height: 46px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            border-radius: 15px;

            background:
                linear-gradient(
                    100deg,
                    #06b6d4,
                    #14b8a6 48%,
                    #2563eb
                );

            border: 1px solid rgba(103,232,249,.55);

            color: #02131b;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: .13em;

            box-shadow:
                0 8px 25px rgba(6,182,212,.22),
                inset 0 1px 0 rgba(255,255,255,.3);

            transition:
                transform .2s ease,
                box-shadow .2s ease,
                filter .2s ease;
        }

        .gift-button:hover {
            filter: brightness(1.08);
            box-shadow:
                0 10px 30px rgba(6,182,212,.35),
                inset 0 1px 0 rgba(255,255,255,.35);
        }

        .gift-button:active {
            transform: scale(.97);
        }

        /* Dòng xác thực */
        .gift-verified {
            margin-top: 9px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;

            font-size: 9px;
            font-weight: 700;
            color: #64748b;
        }

        .gift-verified i {
            color: #22c55e;
            font-size: 9px;
        }

        /* Mobile nhỏ */
        @media (max-width: 380px) {
            .gift-scene {
                height: 125px;
            }

            .gift-cube,
            .gift-face {
                width: 76px;
                height: 76px;
            }

            .gift-front {
                transform: rotateY(0deg) translateZ(38px);
            }

            .gift-right {
                transform: rotateY(90deg) translateZ(38px);
            }

            .gift-back {
                transform: rotateY(180deg) translateZ(38px);
            }

            .gift-left {
                transform: rotateY(-90deg) translateZ(38px);
            }

            .gift-top {
                transform: rotateX(90deg) translateZ(38px);
            }

            .gift-bottom {
                transform: rotateX(-90deg) translateZ(38px);
            }

            .gift-title {
                font-size: 15px;
            }

            .gift-button {
                min-height: 44px;
            }
        }
    </style>


    <!-- =========================
         KHỐI HỘP QUÀ
    ========================== -->
    <div
        class="gift-scene cursor-pointer"
        @click="if(!isOpening){ isOpening = true; setTimeout(() => openGift(), 600) }"
    >

        <!-- Glow -->
        <div class="gift-glow"></div>

        <!-- Vòng sáng nhẹ -->
        <div class="absolute w-20 h-20 rounded-full
                    border border-cyan-400/10
                    animate-ping pointer-events-none">
        </div>

        <!-- Cube -->
        <div
            class="gift-cube"
            :class="isOpening ? 'gift-opening' : ''"
        >

            <!-- Nơ -->
            <div class="gift-bow pointer-events-none">
                <i class="fa-solid fa-bow-tie"></i>
            </div>


            <!-- FRONT -->
            <div class="gift-face gift-front overflow-hidden rounded-lg">

                <div class="gift-ribbon-v"></div>
                <div class="gift-ribbon-h"></div>

                <div class="relative z-10 w-[72px] h-[72px]
                            rounded-md overflow-hidden
                            bg-slate-950
                            border border-cyan-400/70
                            flex items-center justify-center
                            shadow-[0_0_12px_rgba(6,182,212,.15)]">

                    <img
                        src="https://homestechjsc.vn/wp-content/uploads/2026/09/LOGOCAFFE.png"
                        alt="Logo"
                        class="w-full h-full object-contain p-1 brightness-125"
                    >
                </div>
            </div>


            <!-- RIGHT -->
            <div class="gift-face gift-right">
                <div class="gift-ribbon-h"></div>

                <i class="fa-solid fa-gift gift-side-icon"></i>
            </div>


            <!-- BACK -->
            <div class="gift-face gift-back">

                <div class="gift-ribbon-v"></div>
                <div class="gift-ribbon-h"></div>

                <i class="fa-solid fa-gift gift-side-icon"></i>
            </div>


            <!-- LEFT -->
            <div class="gift-face gift-left">

                <div class="gift-ribbon-h"></div>

                <i class="fa-solid fa-gift gift-side-icon"></i>
            </div>


            <!-- TOP -->
            <div class="gift-face gift-top rounded-lg">
                <div class="absolute inset-0
                            bg-gradient-to-br
                            from-cyan-300/10
                            to-transparent">
                </div>
            </div>


            <!-- BOTTOM -->
            <div class="gift-face gift-bottom rounded-lg"></div>

        </div>
    </div>


    <!-- =========================
         NỘI DUNG
    ========================== -->
    <div class="text-center mt-2 px-3">

    <h2 class="font-black text-lg text-white tracking-wide">
        Hộp Quà Tri Ân
    </h2>

    <p class="text-[11px] text-slate-400 mt-1.5 leading-relaxed">
        Hóa đơn đã được xác thực. Chạm vào hộp quà để mở
        <br>
        thưởng ngay!
    </p>

</div>


    <!-- =========================
         BUTTON
    ========================== -->
    <button
        @click="if(!isOpening){ isOpening = true; setTimeout(() => openGift(), 600) }"
        :disabled="isOpening"
        class="gift-button"
    >
        <i class="fa-solid fa-gift"></i>

        <span>Mở Hộp Quà Ngay</span>

        <i class="fa-solid fa-arrow-right text-[9px]"></i>
    </button>


    <!-- VERIFIED -->
    <div class="gift-verified">
        <i class="fa-solid fa-circle-check"></i>
        <span>HÓA ĐƠN ĐÃ XÁC THỰC AN TOÀN</span>
    </div>

</div>

</template>


        <!-- Trạng thái 2: Đã mở quà thành công -->
        <!-- Trạng thái 2: Đã mở quà (Đã tối ưu giao diện gọn gàng, sang trọng và bắt mắt) -->
        <template x-if="hasOpened">
            <div class="space-y-4 py-1 animate-fadeIn relative z-10">
                
                <!-- TRƯỜNG HỢP 1: TRÚNG QUÀ GIÁ TRỊ (Voucher, Giảm giá, Quà tặng) -->
                <template x-if="wonPrize && wonPrize.type !== 'none' && wonPrize.value > 0 && !wonPrize.name.toLowerCase().includes('chúc may mắn')">
                    <div class="space-y-3">
                        <div class="relative">
                            <div class="absolute inset-0 bg-emerald-500/20 rounded-2xl blur-xl"></div>
                            <div class="relative w-16 h-16 bg-gradient-to-br from-emerald-400 to-teal-600 text-slate-950 rounded-2xl flex items-center justify-center mx-auto text-2xl shadow-[0_0_20px_rgba(16,185,129,0.4)] border border-emerald-300/50 animate-bounce">
                                <i class="fa-solid fa-trophy"></i>
                            </div>
                        </div>

                        <div class="space-y-1.5 pt-1">
                            <span class="inline-block text-[10px] bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 font-extrabold px-3 py-1 rounded-full uppercase tracking-wider">Chúc Mừng Trúng Thưởng</span>
                            <h2 class="font-black text-lg text-white leading-snug px-1" x-text="wonPrize.name"></h2>
                            <p class="text-xs text-slate-400 px-2 leading-relaxed" x-text="getPrizeDescription(wonPrize)"></p>
                        </div>

                        <div class="p-4 bg-slate-950/90 border border-amber-500/40 rounded-2xl text-left space-y-2 shadow-[0_10px_25px_rgba(0,0,0,0.5)]">
                            <div class="flex justify-between items-center">
                                <p class="text-amber-400/90 text-[10px] uppercase font-bold tracking-wider">Mã xác nhận tại quầy:</p>
                                <span class="text-[10px] text-emerald-400 font-semibold bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20">Hợp lệ</span>
                            </div>
                            <p class="font-mono font-black text-2xl text-amber-300 tracking-widest text-center py-1 bg-slate-900/80 rounded-xl border border-amber-500/20 shadow-inner" x-text="voucherCode"></p>
                            <p class="text-[10px] text-slate-400 italic text-center pt-0.5">* Vui lòng chụp màn hình đưa cho thu ngân khi thanh toán.</p>
                        </div>
                    </div>
                </template>

                <!-- TRƯỜNG HỢP 2: QUÀ TRI ÂN / AN ỦI -->
                <template x-if="wonPrize && wonPrize.type === 'gift' && (wonPrize.value == 0 || !wonPrize.value)">
                    <div class="space-y-3 py-1">
                        <div class="w-16 h-16 bg-gradient-to-br from-cyan-400 to-blue-600 text-slate-950 rounded-2xl flex items-center justify-center mx-auto text-2xl shadow-[0_0_20px_rgba(6,182,212,0.4)] border border-cyan-300/50">
                            <i class="fa-solid fa-gift"></i>
                        </div>
                        <div class="space-y-1">
                            <span class="inline-block text-[10px] bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 font-extrabold px-3 py-1 rounded-full uppercase tracking-wider">Món Quà Tri Ân</span>
                            <h2 class="font-black text-xl text-white pt-1" x-text="wonPrize.name"></h2>
                            <p class="text-xs text-slate-400 px-4 leading-relaxed">Cảm ơn bạn đã đồng hành cùng HomesCoffee. Chúc bạn có những phút giây tuyệt vời!</p>
                        </div>
                    </div>
                </template>

                <!-- TRƯỜNG HỢP 3: CHÚC MAY MẮN LẦN SAU -->
                <template x-if="!wonPrize || wonPrize.type === 'none' || wonPrize.name.toLowerCase().includes('chúc may mắn')">
                    <div class="space-y-3 py-1">
                        <div class="w-16 h-16 bg-slate-800 text-amber-400 border border-slate-700 rounded-2xl flex items-center justify-center mx-auto text-2xl shadow-inner">
                            <i class="fa-solid fa-face-smile-wink"></i>
                        </div>
                        <div class="space-y-1">
                            <span class="inline-block text-[10px] bg-slate-800 text-slate-400 border border-slate-700 font-extrabold px-3 py-1 rounded-full uppercase tracking-wider">Hẹn Gặp Lại Bạn</span>
                            <h2 class="font-black text-xl text-white pt-1">Chúc may mắn lần sau!</h2>
                            <p class="text-xs text-slate-400 px-4 leading-relaxed">Hôm nay chưa phải ngày may mắn của bạn. Đừng quên ghé HomesCoffee nhận quà ở hóa đơn tiếp theo nhé!</p>
                        </div>
                    </div>
                </template>

            </div>
        </template>

        <!-- Footer -->
        <div class="pt-3 border-t border-slate-800 text-[10px] text-slate-500 relative z-10">
            Hotline hỗ trợ: <strong class="text-slate-400">0972.023.222</strong>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCjolGY6uh5pY7CHIc0ON6m8qNSz5xJDXM",
            authDomain: "dbcoffee-bbeaf.firebaseapp.com",
            databaseURL: "https://dbcoffee-bbeaf-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "dbcoffee-bbeaf",
            storageBucket: "dbcoffee-bbeaf.firebasestorage.app",
            messagingSenderId: "118275632803",
            appId: "1:118275632803:web:459762b6ace8d1c25ed916",
            measurementId: "G-MHVZ55R50Y"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function giftApp() {
            return {
                prizesList: [],
                isInvalidLink: true,
                errorMessage: 'Đang kiểm tra tính hợp lệ của mã QR...',
                hasOpened: false,
                wonPrize: null,
                voucherCode: '',
                currentToken: null,

                init() {
                    const urlParams = new URLSearchParams(window.location.search);
                    const token = urlParams.get('token');

                    if (!token) {
                        this.isInvalidLink = true;
                        this.errorMessage = 'Bạn không thể truy cập trực tiếp trang này nếu không có mã QR từ hóa đơn thanh toán.';
                        return;
                    }

                    this.currentToken = token;

                    db.ref('giftSessions/' + token).once('value', snap => {
                        const sessionData = snap.val();
                        if (!sessionData) {
                            this.isInvalidLink = true;
                            this.errorMessage = 'Mã QR không tồn tại hoặc đã hết hạn.';
                            return;
                        }

                        if (sessionData.used) {
                            this.isInvalidLink = true;
                            this.errorMessage = 'Mã QR này đã được sử dụng để mở quà trước đó. Mỗi hóa đơn chỉ được mở 1 lần duy nhất!';
                            return;
                        }

                        this.isInvalidLink = false;
                        db.ref('miniGamePrizes').once('value', prizeSnap => {
                            const d = prizeSnap.val();
                            if (d) {
                                this.prizesList = Object.keys(d).map(k => ({ id: k, ...d[k] })).filter(p => p.isActive);
                            }
                        });
                    });
                },

                openGift() {
                    if (this.prizesList.length === 0) {
                        alert('Chương trình mở quà hiện chưa sẵn sàng.');
                        return;
                    }

                    db.ref('giftSessions/' + this.currentToken).update({ used: true });

                    const totalChance = this.prizesList.reduce((sum, p) => sum + Number(p.chance || 0), 0);
                    let randomNum = Math.random() * totalChance;
                    let accumulated = 0;
                    let selected = this.prizesList[0];

                    for (let p of this.prizesList) {
                        accumulated += Number(p.chance || 0);
                        if (randomNum <= accumulated) {
                            selected = p;
                            break;
                        }
                    }

                    this.wonPrize = selected;
                    this.voucherCode = 'HC' + Math.floor(100000 + Math.random() * 900000);
                    this.hasOpened = true;

                    db.ref('wonGifts').push({
                        prizeName: selected.name,
                        code: this.voucherCode,
                        token: this.currentToken,
                        timestamp: new Date().toISOString()
                    });
                },

                getPrizeDescription(prize) {
                    if (prize.type === 'discount') return `Bạn nhận được ưu đãi giảm ${prize.value}% cho hóa đơn tiếp theo.`;
                    if (prize.type === 'gift') return `Bạn được tặng ngay một phần quà/topping miễn phí.`;
                    if (prize.type === 'voucher') return `Bạn nhận được mã voucher giảm trực tiếp ${Number(prize.value).toLocaleString()}đ.`;
                    return `Rất tiếc, chúc bạn may mắn trong lần ghé thăm tới!`;
                }
            }
        }
    </script>
</body>
</html>
